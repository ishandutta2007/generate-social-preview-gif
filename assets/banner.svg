<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui; font-weight: 900; font-size: 52px; }
    .subtitle { font-family: system-ui; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .tagline { font-family: system-ui; font-weight: 600; font-size: 14px; fill: #38bdf8; letter-spacing: 2px; text-transform: uppercase; }
    .node-text { font-family: system-ui; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    .grid-line { stroke: #334155; stroke-opacity: 0.25; stroke-width: 1; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />

  <g class="grid-line">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
  </g>

  <circle cx="150" cy="100" r="140" fill="#6366f1" opacity="0.18" filter="url(#glow)">
    <animate attributeName="cx" values="150;200;150" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="240" r="160" fill="#06b6d4" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cx" values="1050;1000;1050" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="180" r="120" fill="#c084fc" opacity="0.12" filter="url(#glow)" />

  <g transform="translate(70, 0)">
    <rect x="0" y="55" width="260" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="16" cy="70" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="75" class="tagline">SOCIAL PREVIEW GENERATOR</text>

    <text x="0" y="145" class="title" fill="url(#primary-grad)">
      Awesome Social Preview GIF
    </text>

    <text x="0" y="195" class="subtitle">
      Curated GIF generator for GitHub social preview images &amp; banners
    </text>

    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="140" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="18" y="24" class="node-text">⚡ Animated GIF</text>

      <rect x="155" y="0" width="150" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="173" y="24" class="node-text">🎨 Banner Mirror</text>

      <rect x="320" y="0" width="130" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="338" y="24" class="node-text">📦 Under 1MB</text>

      <rect x="465" y="0" width="150" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="483" y="24" class="node-text">🖥️ 640×320px</text>
    </g>
  </g>

  <g transform="translate(920, 80)">
    <rect x="40" y="10" width="130" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="105" y="36" class="node-text" text-anchor="middle">SVG PARSER</text>

    <path d="M 105 52 L 105 105" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.5s" repeatCount="indefinite" />
    </path>

    <rect x="30" y="105" width="150" height="42" rx="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" />
    <text x="105" y="131" class="node-text" text-anchor="middle">FRAME RENDERER</text>

    <path d="M 105 147 L 105 190" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="0;-16" dur="1.5s" repeatCount="indefinite" />
    </path>

    <rect x="30" y="190" width="150" height="36" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <text x="105" y="213" class="node-text" text-anchor="middle">GIF OUTPUT</text>
  </g>
</svg>
