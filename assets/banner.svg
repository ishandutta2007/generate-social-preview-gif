<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="320" fill="url(#bg-grad)" />
  <rect width="640" height="320" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs with SVG Animation -->
  <circle cx="120" cy="100" r="90" fill="#38bdf8" opacity="0.15">
    <animate attributeName="r" values="80;100;80" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="4s" repeatCount="indefinite" />
  </circle>

  <circle cx="520" cy="220" r="110" fill="#818cf8" opacity="0.15">
    <animate attributeName="r" values="100;120;100" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Content Container (y: 50 to 270) -->
  <!-- Top Badge -->
  <rect x="50" y="65" width="180" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="140" y="82" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">AUTOMATED GIF GENERATOR</text>

  <!-- Title -->
  <text x="50" y="135" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#primary-grad)" class="title">Social Preview GIF Generator</text>

  <!-- Subtitle -->
  <text x="50" y="168" font-family="Arial, sans-serif" font-size="15" fill="#94a3b8" class="subtitle">High-Fidelity 640x320px GitHub Social Preview Animations</text>

  <!-- Feature Pills -->
  <rect x="50" y="200" width="120" height="28" rx="6" fill="#334155" opacity="0.8" />
  <text x="110" y="219" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle" class="node-text">SVG Theme Match</text>

  <rect x="180" y="200" width="110" height="28" rx="6" fill="#334155" opacity="0.8" />
  <text x="235" y="219" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle" class="node-text">&lt; 1MB Output</text>

  <rect x="300" y="200" width="130" height="28" rx="6" fill="#334155" opacity="0.8" />
  <text x="365" y="219" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle" class="node-text">Python &amp; Node.js</text>

  <!-- Dynamic Beam Wave -->
  <path d="M 50 250 Q 150 230, 250 250 T 450 250 T 590 250" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4">
    <animate attributeName="stroke-dashoffset" from="0" to="24" dur="1s" repeatCount="indefinite" />
  </path>

  <!-- Pulsing Beam Dot -->
  <circle cx="450" cy="250" r="5" fill="#38bdf8">
    <animate attributeName="r" values="3;7;3" dur="1.5s" repeatCount="indefinite" />
  </circle>
</svg>
